---
global:
  temp_dir: ./test/work
  nf_config: test/global.config
  remove_temp: false
  clean_logs: true

cases:
  - name: test-integration-OpenMS
    message: Fractionated integration test with multiple samples and search engines
    nf_script: main.nf
    nf_config: test/test_integration/test.config
    skip: false
    verbose: true

  - name: test-integration-MSBooster
    message: Fractionated integration test with multiple samples and MSBooster Percolator features
    nf_script: main.nf
    nf_config: test/test_integration_msbooster/test.config
    skip: false
    verbose: true

  - name: test-integration-MSBooster-MSFragger-DIA
    message: DIA MSFragger integration test with MSBooster Percolator features
    nf_script: main.nf
    nf_config: test/test_integration_msbooster_msfragger_dia/test.config
    skip: false
    verbose: true

  - name: test-integration-ProteinProphet
    message: DIA MSFragger integration test with iProphet and ProteinProphet EasyPQP export
    nf_script: main.nf
    nf_config: test/test_integration_proteinprophet/test.config
    skip: false
    verbose: true

  - name: test-integration-Fido
    message: DIA MSFragger integration test with Fido EasyPQP export
    nf_script: main.nf
    nf_config: test/test_integration_fido/test.config
    skip: false
    verbose: true

  - name: test-integration-Epifany
    message: DIA MSFragger integration test with Epifany EasyPQP export
    nf_script: main.nf
    nf_config: test/test_integration_epifany/test.config
    skip: false
    verbose: true
