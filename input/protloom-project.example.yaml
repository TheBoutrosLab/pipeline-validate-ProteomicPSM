# Use the project YAML from ProtLoom buildDB and ensure these fields are present.
# Relative paths use this YAML file's directory. $VARIABLE paths use the environment.
# Sample IDs must match input.csv sample_name.
schema_version: 1

database:
  output_fasta: database/protloom-database.fasta
  output_entries_tsv: database/protloom-database.entries.tsv

annotations:
  - annotation_id: reference
    gtf_path: annotations/reference.gtf

samples:
  - sample_id: sample_1
    annotation_id: reference
