input_csv:
  type: Path
  mode: r
  required: true
  help: CSV containing sample_name, search_engine, and idXML columns.
input_mzml_csv:
  type: Path
  mode: r
  required: false
  help: CSV containing sample_name, fraction, and mzML columns; required for MSBooster or EasyPQP export.
output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
decoy_database:
  type: Path
  mode: r
  required: true
  help: Target-decoy FASTA used for peptide indexing.
decoy_string:
  type: String
  required: false
  help: Decoy protein prefix.
merge_consensus:
  type: Bool
  required: false
  help: Merge consensus.
fractionated:
  type: Bool
  required: false
  help: Fractionated.
skip_peptide_indexing:
  type: Bool
  required: false
  help: Skip peptide indexing.
run_percolator:
  type: Bool
  required: false
  help: Run percolator.
percolator_workflow:
  type: String
  required: false
  help: Percolator route, openms (default) or msbooster.
msbooster_params:
  type: Path
  mode: r
  required: false
  help: MSBooster prediction settings; defaults to the bundled DIA-NN configuration.
fragpipe_version:
  type: String
  required: false
  help: FragPipe image version, default 24.0.
docker_image_fragpipe:
  type: String
  required: false
  help: FragPipe image containing MSBooster, DIA-NN, and Percolator.
run_protloom:
  type: Bool
  required: false
  help: Run ProtLoom inference and FDR after MSBooster and Percolator.
dataset_id:
  type: String
  required: false
  help: Dataset directory name for cohort-level ProtLoom outputs; default cohort.
export_easypqp_reports:
  type: Bool
  required: false
  help: Export dataset-prefixed EasyPQP reports using ProtLoom or the selected non-ProtLoom protein inference algorithm.
protein_inference_algorithm:
  type: String
  required: false
  help: Non-ProtLoom protein grouping backend, ProteinProphet (default), Fido, or Epifany; Epiphany is an alias.
docker_image_fido:
  type: String
  required: false
  help: Standalone Fido container containing FidoChooseParameters.
fido_min_probability:
  type: Number
  required: false
  help: Minimum Fido group posterior probability for EasyPQP export; default 0.01.
epifany_min_probability:
  type: Number
  required: false
  help: Minimum Epifany group posterior probability for EasyPQP export; default 0.01.
epifany_greedy_group_resolution:
  type: String
  required: false
  choices: [none, remove_associations_only, remove_proteins_wo_evidence]
  help: Epifany shared-peptide resolution mode; default none.
proteinprophet_min_probability:
  type: Number
  required: false
  help: Minimum ProteinProphet group probability for EasyPQP export; groups below the cutoff are excluded. Default 0.
easypqp_psm_qvalue:
  type: Number
  required: false
  help: Maximum PSM q-value for EasyPQP export in every inference route; default 0.01.
protloom_version:
  type: String
  required: false
  help: ProtLoom version used in output paths.
docker_image_protloom:
  type: String
  required: false
  help: Container image built from the ProtLoom repository.
protloom_project_yaml:
  type: Path
  mode: r
  required: false
  help: ProtLoom project YAML with database outputs, annotations, and sample-to-annotation mappings; required when run_protloom is true.
protloom_pt_order:
  type: String
  required: false
  allow_empty: true
  help: Comma-separated protein-tier order for ProtLoom.
protloom_pc_order:
  type: String
  required: false
  allow_empty: true
  help: Comma-separated peptide-class order for ProtLoom.
protloom_enzyme:
  type: String
  required: false
  help: ProtLoom cleavage rule name, default trypsin.
protloom_easypqp_group_qvalue:
  type: Number
  required: false
  help: Maximum ProtLoom protein-group q-value for EasyPQP export; default 0.01.
protloom_idxml_primary_score:
  type: String
  required: false
  help: Primary score in ProtLoom-annotated idXML, original (default), pep, or q_value.
protloom_idxml_unmatched_psms:
  type: String
  required: false
  help: Handling for PSMs without mapped ProtLoom results, remove (default) or keep.
save_intermediate_files:
  type: Bool
  required: false
  help: Save intermediate files.
filter_psm_remove_decoys:
  type: Bool
  required: false
  help: Filter psm remove decoys.
filter_psm_keep_unreferenced_protein_hits:
  type: Bool
  required: false
  help: Filter psm keep unreferenced protein hits.
filter_psm_delete_unreferenced_peptide_hits:
  type: Bool
  required: false
  help: Filter psm delete unreferenced peptide hits.
fdr_algorithm_no_qvalues:
  type: Bool
  required: false
  help: Fdr algorithm no qvalues.
filter_psm_whitelist_proteins:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_whitelist_peptides:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_blacklist_proteins:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_blacklist_peptides:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_in_silico_digestion:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
enzyme:
  type: String
  required: false
  help: Digest enzyme for PeptideIndexer and Percolator.
filter_psm_score_peptide:
  type: Number
  required: false
  help: Peptide FDR cutoff.
ucla_cds:
  type: Bool
  default: false
  help: Shared execution compatibility flag.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource overrides.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory updates.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU updates.
