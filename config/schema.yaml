input_csv:
  type: Path
  mode: r
  required: true
  help: CSV containing sample_name, search_engine, and idXML columns.
output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
decoy_database:
  type: Path
  mode: r
  required: true
  help: Target-decoy FASTA used for peptide indexing.
decoy_string:
  type: String
  required: false
  help: Decoy protein prefix.
merge_consensus:
  type: Bool
  required: false
  help: Merge consensus.
fractionated:
  type: Bool
  required: false
  help: Fractionated.
skip_peptide_indexing:
  type: Bool
  required: false
  help: Skip peptide indexing.
run_percolator:
  type: Bool
  required: false
  help: Run percolator.
save_intermediate_files:
  type: Bool
  required: false
  help: Save intermediate files.
filter_psm_remove_decoys:
  type: Bool
  required: false
  help: Filter psm remove decoys.
filter_psm_keep_unreferenced_protein_hits:
  type: Bool
  required: false
  help: Filter psm keep unreferenced protein hits.
filter_psm_delete_unreferenced_peptide_hits:
  type: Bool
  required: false
  help: Filter psm delete unreferenced peptide hits.
fdr_algorithm_no_qvalues:
  type: Bool
  required: false
  help: Fdr algorithm no qvalues.
filter_psm_whitelist_proteins:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_whitelist_peptides:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_blacklist_proteins:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_blacklist_peptides:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
filter_psm_in_silico_digestion:
  type: Path
  mode: r
  required: false
  help: Optional IDFilter input.
enzyme:
  type: String
  required: false
  help: Digest enzyme for PeptideIndexer and Percolator.
filter_psm_score_peptide:
  type: Number
  required: false
  help: Peptide FDR cutoff.
ucla_cds:
  type: Bool
  default: false
  help: Shared execution compatibility flag.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource overrides.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory updates.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU updates.
