---
dataset_id:
  type: 'String'
  required: true
  help: 'Dataset identifier'
patient_id:
  type: 'String'
  required: true
  help: 'Patient identifier'
sample_id:
  type: 'String'
  required: true
  help: 'Sample identifier'
param_name:
  type: 'String'
  required: false
  default: 'foo-bar'
  help: 'Example pipeline parameter; replace with pipeline-specific parameters'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Absolute path to output directory'
apptainer_library:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Absolute path to Apptainer library directory'
apptainer_cache:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Absolute path to Apptainer cache directory'
singularity_library:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Absolute path to Singularity library directory'
singularity_cache:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Absolute path to Singularity cache directory'
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  help: 'User-defined modifications for adjusting base resource allocations for processes'
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
      help: 'List of memory updates'
    cpus:
      type: 'ResourceUpdateList'
      required: false
      help: 'List of CPU updates'
input:
  type: 'InputNamespace'
  required: true
  help: 'Input samples'
  elements:
    BAM:
      type: 'InputBAMNamespace'
      required: true
      help: 'Input BAM samples grouped by sample type'
      elements:
        normal:
          type: 'BAMEntryList'
          required: false
          help: 'Input normal sample'
        tumor:
          type: 'BAMEntryList'
          required: false
          help: 'Input tumor sample'
